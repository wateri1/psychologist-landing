<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="warmPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E5D4E"/>
      <stop offset="100%" stop-color="#6E3B30"/>
    </linearGradient>
    <filter id="supervisionShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="760" height="520" rx="6" fill="url(#warmPaper)" stroke="#DECFC4" stroke-width="2" filter="url(#supervisionShadow)"/>
  <rect x="36" y="36" width="728" height="488" rx="4" fill="none" stroke="#9E5D4E" stroke-width="1.2" stroke-opacity="0.7"/>
  <rect x="42" y="42" width="716" height="476" rx="3" fill="none" stroke="#C9B8AD" stroke-width="0.8"/>

  <!-- Logo/Emblem icon -->
  <g transform="translate(400, 85)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#9E5D4E" stroke-width="1.5"/>
    <path d="M -8 2 L 0 -8 L 8 2 L 0 10 Z" fill="#9E5D4E"/>
  </g>

  <text x="400" y="125" font-family="'Georgia', serif" font-size="12" fill="#7D463A" letter-spacing="3" text-anchor="middle" text-transform="uppercase">Ассоциация Русскоязычных Гештальт-Институтов</text>
  <text x="400" y="142" font-family="'Georgia', serif" font-size="10" fill="#A87367" letter-spacing="2" text-anchor="middle">СОВЕТ ПО ПРОФЕССИОНАЛЬНОЙ ЭТИКЕ И СТАНДАРТАМ ПРАКТИКИ</text>

  <line x1="300" y1="160" x2="500" y2="160" stroke="#CCBDB3" stroke-width="1"/>

  <text x="400" y="210" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#3D201A" letter-spacing="3" text-anchor="middle">СВИДЕТЕЛЬСТВО О СУПЕРВИЗИИ</text>
  <text x="400" y="235" font-family="'Georgia', serif" font-size="11" fill="#8C5C52" letter-spacing="3" text-anchor="middle">РЕГИСТР СУПЕРВИЗИРУЕМЫХ СПЕЦИАЛИСТОВ • 2024</text>

  <text x="400" y="278" font-family="'Georgia', serif" font-size="14" fill="#6E4A43" font-style="italic" text-anchor="middle">Дано в подтверждение того, что</text>
  <text x="400" y="318" font-family="'Georgia', serif" font-size="26" font-weight="bold" fill="#24120E" letter-spacing="1" text-anchor="middle">Мельникова Анна Сергеевна</text>

  <text x="400" y="356" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#523933" text-anchor="middle">ведет регулярную непрерывную практику под профессиональной супервизией</text>
  <text x="400" y="382" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#421E17" letter-spacing="0.5" text-anchor="middle">380+ подтвержденных часов индивидуальной и групповой супервизии</text>
  <text x="400" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#785952" text-anchor="middle">А также более 260 часов подтвержденной личной индивидуальной психотерапии</text>

  <g transform="translate(190, 462)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#terracottaGrad)" stroke-width="2" stroke-dasharray="6 2"/>
    <circle cx="0" cy="0" r="30" fill="#FCFAF7" stroke="#9E5D4E" stroke-width="1"/>
    <text x="0" y="-7" font-family="'Georgia', serif" font-size="7" fill="#7D463A" text-anchor="middle" font-weight="bold">АРГИ ЭТИКА</text>
    <text x="0" y="6" font-family="'Georgia', serif" font-size="8" fill="#421E17" text-anchor="middle" font-weight="bold">ПОДТВЕРЖДЕНО</text>
    <text x="0" y="17" font-family="'Georgia', serif" font-size="6" fill="#7D463A" text-anchor="middle">СТАНДАРТ 2024</text>
  </g>

  <g transform="translate(480, 455)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#9C827A" stroke-width="1"/>
    <text x="80" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#785952" text-anchor="middle">Аккредитованный супервизор ассоциации</text>
    <path d="M 25 -10 Q 60 -30 90 -5 T 125 -20 T 145 -10" fill="none" stroke="#2B1410" stroke-width="1.5"/>
  </g>
</svg>
