<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="eapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#EFEBE2"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5868"/>
      <stop offset="100%" stop-color="#2D3742"/>
    </linearGradient>
    <filter id="eapShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="760" height="520" rx="6" fill="url(#eapBg)" stroke="#D8D2C5" stroke-width="2" filter="url(#eapShadow)"/>
  <rect x="36" y="36" width="728" height="488" rx="4" fill="none" stroke="#4A5868" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="42" y="42" width="716" height="476" rx="3" fill="none" stroke="#C4BCAD" stroke-width="0.8"/>

  <!-- Top Ribbon Emblem -->
  <g transform="translate(400, 85)">
    <polygon points="0,-18 16,-8 16,12 0,22 -16,12 -16,-8" fill="none" stroke="#4A5868" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Georgia', serif" font-size="10" font-weight="bold" fill="#4A5868" text-anchor="middle">EAP</text>
  </g>

  <text x="400" y="125" font-family="'Georgia', serif" font-size="12" fill="#43505E" letter-spacing="3" text-anchor="middle" text-transform="uppercase">European Association for Psychotherapy</text>
  <text x="400" y="142" font-family="'Georgia', serif" font-size="10" fill="#758291" letter-spacing="2" text-anchor="middle">INTERNATIONAL ADVANCED TRAINING ACCREDITATION</text>

  <line x1="300" y1="160" x2="500" y2="160" stroke="#BFB7A8" stroke-width="1"/>

  <text x="400" y="210" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#202A33" letter-spacing="4" text-anchor="middle">СЕРТИФИКАТ КВАЛИФИКАЦИИ</text>
  <text x="400" y="235" font-family="'Georgia', serif" font-size="11" fill="#6A7A8C" letter-spacing="3" text-anchor="middle">СЕРИЯ ЕВРО-ИНТЕГРАЦИЯ № INT-9310</text>

  <text x="400" y="278" font-family="'Georgia', serif" font-size="14" fill="#586777" font-style="italic" text-anchor="middle">Настоящим подтверждается, что</text>
  <text x="400" y="318" font-family="'Georgia', serif" font-size="26" font-weight="bold" fill="#141B21" letter-spacing="1" text-anchor="middle">Мельникова Анна Сергеевна</text>

  <text x="400" y="356" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#455361" text-anchor="middle">прошла международный курс углубленного практикума</text>
  <text x="400" y="382" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#243444" letter-spacing="0.5" text-anchor="middle">«Интегративная соматическая и телесно-ориентированная терапия тревоги»</text>
  <text x="400" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6C7A87" text-anchor="middle">Общий объем: 320 академических часов, включая практическую супервизию клинических случаев</text>

  <g transform="translate(190, 462)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#slateGrad)" stroke-width="2" stroke-dasharray="6 2"/>
    <circle cx="0" cy="0" r="30" fill="#FAF9F6" stroke="#4A5868" stroke-width="1"/>
    <text x="0" y="-7" font-family="'Georgia', serif" font-size="7" fill="#43505E" text-anchor="middle" font-weight="bold">EAP ACCREDITED</text>
    <text x="0" y="6" font-family="'Georgia', serif" font-size="8" fill="#1C2733" text-anchor="middle" font-weight="bold">CERTIFIED</text>
    <text x="0" y="17" font-family="'Georgia', serif" font-size="6" fill="#43505E" text-anchor="middle">INTERN. REGISTRY</text>
  </g>

  <g transform="translate(480, 455)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#7E8D9C" stroke-width="1"/>
    <text x="80" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6A7A8C" text-anchor="middle">Президент ассоциации / Сертифицирующий совет</text>
    <path d="M 20 -20 Q 55 -5 80 -25 T 130 -10 T 150 -18" fill="none" stroke="#1F2A38" stroke-width="1.5"/>
  </g>
</svg>
