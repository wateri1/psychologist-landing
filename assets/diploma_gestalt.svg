<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="gestaltBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F6352"/>
      <stop offset="50%" stop-color="#687F6C"/>
      <stop offset="100%" stop-color="#3D4E40"/>
    </linearGradient>
    <filter id="gestaltShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="760" height="520" rx="6" fill="url(#gestaltBg)" stroke="#E0D8CA" stroke-width="2" filter="url(#gestaltShadow)"/>
  
  <rect x="36" y="36" width="728" height="488" rx="4" fill="none" stroke="#687F6C" stroke-width="1.2" stroke-opacity="0.7"/>
  <rect x="42" y="42" width="716" height="476" rx="3" fill="none" stroke="#C9C0AF" stroke-width="0.8"/>

  <!-- Logo/Emblem icon -->
  <g transform="translate(400, 85)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#687F6C" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#687F6C" stroke-width="1" stroke-dasharray="3 2"/>
    <circle cx="0" cy="0" r="4" fill="#687F6C"/>
  </g>

  <!-- Institution -->
  <text x="400" y="125" font-family="'Georgia', serif" font-size="12" fill="#586B5A" letter-spacing="3" text-anchor="middle" text-transform="uppercase">Московский Институт Гештальта и Психодрамы</text>
  <text x="400" y="142" font-family="'Georgia', serif" font-size="10" fill="#879989" letter-spacing="2" text-anchor="middle">ACCREDITED BY EUROPEAN ASSOCIATION FOR GESTALT THERAPY (EAGT)</text>

  <line x1="300" y1="160" x2="500" y2="160" stroke="#C4BBAA" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="210" font-family="'Georgia', serif" font-size="30" font-weight="bold" fill="#29332A" letter-spacing="4" text-anchor="middle">СЕРТИФИКАТ ПРАКТИКА</text>
  <text x="400" y="235" font-family="'Georgia', serif" font-size="11" fill="#758A77" letter-spacing="3" text-anchor="middle">РЕГИСТРАЦИОННЫЙ № GT-2021-084</text>

  <text x="400" y="278" font-family="'Georgia', serif" font-size="14" fill="#667367" font-style="italic" text-anchor="middle">Удостоверяет, что</text>
  <text x="400" y="318" font-family="'Georgia', serif" font-size="26" font-weight="bold" fill="#1C241D" letter-spacing="1" text-anchor="middle">Мельникова Анна Сергеевна</text>

  <text x="400" y="356" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4B574C" text-anchor="middle">успешно завершила 4-годичную программу профессиональной подготовки (1200 ак. часов)</text>
  <text x="400" y="382" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#304033" letter-spacing="0.5" text-anchor="middle">«Теория и практика гештальт-терапии»</text>
  <text x="400" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6E7D70" text-anchor="middle">Включая 240 часов очной супервизии и 180 часов индивидуальной личной терапии</text>

  <!-- Seal -->
  <g transform="translate(190, 462)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#sageGrad)" stroke-width="2" stroke-dasharray="6 2"/>
    <circle cx="0" cy="0" r="30" fill="#FAF8F5" stroke="#687F6C" stroke-width="1"/>
    <text x="0" y="-7" font-family="'Georgia', serif" font-size="7" fill="#4F6352" text-anchor="middle" font-weight="bold">МИГИП • EAGT</text>
    <text x="0" y="6" font-family="'Georgia', serif" font-size="9" fill="#2E3B30" text-anchor="middle" font-weight="bold">СЕРТИФИЦИРОВАНО</text>
    <text x="0" y="17" font-family="'Georgia', serif" font-size="6" fill="#4F6352" text-anchor="middle">СТАНДАРТ КАЧЕСТВА</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(480, 455)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#8F9E8F" stroke-width="1"/>
    <text x="80" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6E7D70" text-anchor="middle">Руководитель программы / Тренер EAGT</text>
    <path d="M 25 -15 Q 60 -35 85 -5 T 120 -15 T 145 -5" fill="none" stroke="#1D3325" stroke-width="1.5"/>
  </g>
</svg>
